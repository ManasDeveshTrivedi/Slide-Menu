<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Select Menu Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <div class="selector">
            <div id="selectField">
                <p id="selectText">Select Social media</p>
                <img src="images/Images/arrow.png" id="arrowIcon">
            </div>
            <ul id="list" class="hide">
                <li class="options">
                    <img src="Images/Images/facebook.png">
                    <p>Facebook</p>
                </li>
                <li class="options">
                    <img src="Images/Images/instagram.png">
                    <p>Instagram</p>
                </li>
                <li class="options">
                    <img src="Images/Images/pinterest.png">
                    <p>Pinterest</p>
                </li>
                <li class="options">
                    <img src="Images/Images/twitter.png">
                    <p>Twitter</p>
                </li>
                <li class="options">
                    <img src="Images/Images/whatsapp.png">
                    <p>Whatsapp</p>
                </li>
                <li class="options">
                    <img src="Images/Images/youtube.png">
                    <p>You Tube</p>
                </li>
            </ul>
        </div>
    </div>
